<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">

<body>
<title>Ledger Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column — fixed header, scrolling ledger, fixed text tab bar. Light only, by choice. */
:root {
  --paper: #FFFFFF;
  --ink: #111111;
  --muted: #595959;
  --rule: #E4E4E4;
  --rule-soft: #EFEFEF;
  --wash: #F5F5F3;
  --in: #17703F;
  --out: #B83A1C;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--in); }
.neg { color: var(--out); }
.muted { color: var(--muted); }

.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.top { padding: 18px 20px 12px; border-bottom: 2px solid var(--ink); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex: none; }
.top .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.top h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
.top .tools { display: flex; align-items: center; }
.iconbtn { width: 44px; height: 44px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.iconbtn svg { width: 20px; height: 20px; }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 20px 28px; }

.label { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.section { padding: 16px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
.section:last-child { border-bottom: 0; }
.hero { padding: 20px 0 18px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
.big { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 48px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; overflow-wrap: anywhere; }
.sub { font-size: 14px; color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.row.link { text-decoration: none; color: inherit; border: 0; background: none; padding: 0; width: 100%; text-align: left; }
.row .amt { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.indent { padding-left: 14px; font-size: 13px; color: var(--muted); min-height: 32px; }

.bar { height: 3px; background: #EDEDED; position: relative; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.bar.thick { height: 6px; }
.budget { display: flex; flex-direction: column; gap: 6px; }
.budget .row { min-height: 24px; }

.net { display: grid; grid-template-columns: 40px minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.net .track { height: 8px; position: relative; }
.net .track i { position: absolute; top: 0; bottom: 0; left: 0; background: #BFBFBF; }
.net .now { font-weight: 600; color: var(--ink); }

.table { display: flex; flex-direction: column; }
.trow { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 54px; border-bottom: 1px solid var(--rule-soft); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; padding: 6px 0; text-align: left; }
.trow:hover { background: var(--wash); }
.trow .d { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.trow .n { display: flex; flex-direction: column; min-width: 0; }
.trow .n b { font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .n span { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.trow .a { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; text-align: right; white-space: nowrap; }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; border: 1px solid currentColor; padding: 0 4px; line-height: 15px; text-transform: uppercase; }
.thead { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; padding: 14px 0 6px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tabs button { min-height: 44px; padding: 0 9px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-pressed="true"], .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
.tabs.strong { border-bottom: 2px solid var(--ink); gap: 18px; }
.tabs.strong button { padding: 0; border-bottom-width: 4px; margin-bottom: -2px; font-size: 15px; }

.textlink { min-height: 40px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; border: 0; border-bottom: 1px solid var(--ink); background: none; padding: 0; color: var(--ink); text-decoration: none; align-self: flex-start; }
.textlink.quiet { border-bottom-color: transparent; color: var(--muted); }
.btn { height: 50px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 600; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.danger { border-color: var(--out); color: var(--out); }
.btn.danger.armed { background: var(--out); color: var(--paper); }
.btn.wide { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }

.note { font-size: 13px; line-height: 1.5; color: #3A3A3A; border-left: 2px solid var(--ink); padding-left: 10px; }
.banner { margin-top: 14px; padding: 12px 14px; background: var(--wash); display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45; }
.empty { padding: 28px 0; display: flex; flex-direction: column; gap: 12px; color: var(--muted); line-height: 1.5; }

.pot { padding: 16px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
.pot .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.pot .head b { font-size: 17px; }
.pot .head .amt { font-family: var(--mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 12px; }
.facts div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.facts span:first-child { color: var(--muted); }
.facts span:last-child { font-family: var(--mono); font-size: 13px; }
.paylines { display: flex; flex-direction: column; font-size: 13px; }
.paylines .row { min-height: 26px; }
.paylines .mono { font-size: 13px; }
.histtoggle { display: flex; justify-content: space-between; align-items: center; min-height: 44px; width: 100%; border: 0; border-top: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); background: none; padding: 0; font-size: 14px; font-weight: 600; text-align: left; }
.hist { display: flex; flex-direction: column; gap: 0; margin-top: -4px; }
.hrow { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 40px; border: 0; border-bottom: 1px solid var(--rule-soft); background: none; padding: 0; text-align: left; font-size: 13px; width: 100%; }
.hrow > span:last-child { text-align: right; }
.hrow.label { min-height: 30px; font-size: 11px; }
button.hrow:hover { background: var(--wash); }
.hrow.start { border-bottom: 0; }
.sum2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.sum2 > div { display: flex; flex-direction: column; gap: 4px; }
.sum2 > div:last-child { align-items: flex-end; text-align: right; }
.sum2 .v { font-family: var(--mono); font-size: 24px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

/* Add / edit entry */
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--ink); }
.seg button { height: 42px; border: 0; border-left: 1px solid var(--ink); background: var(--paper); font-size: 14px; font-weight: 600; padding: 0 4px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.amount { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 0 10px; border-bottom: 1px solid var(--rule); }
.amount .big { font-size: 44px; display: flex; align-items: baseline; justify-content: flex-end; min-width: 0; flex: 1; }
.amount input { font: inherit; letter-spacing: 0; color: inherit; border: 0; border-bottom: 2px solid transparent; background: transparent; text-align: right; width: 4.2ch; max-width: 100%; min-width: 0; padding: 0; border-radius: 0; caret-color: var(--ink); }
.amount input::placeholder { color: #C4C4C4; }
.amount input:focus { outline: none; border-bottom-color: var(--ink); }
.amount label { cursor: text; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { min-height: 36px; padding: 0 12px; border: 1px solid #BDBDBD; background: var(--paper); font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input, .field select, .field textarea { height: 44px; border: 0; border-bottom: 1px solid var(--ink); background: var(--paper); padding: 0 2px; border-radius: 0; font-size: 16px; width: 100%; min-width: 0; }
.field textarea { height: 120px; border: 1px solid var(--rule); padding: 8px; font-family: var(--mono); font-size: 12px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); }
.fields2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: none; border-left: 0; border-right: 0; padding: 0; text-align: left; width: 100%; }
.check .box { width: 20px; height: 20px; border: 1.5px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--paper); }
.check[aria-checked="true"] .box { background: var(--ink); }
.check .box svg { width: 14px; height: 14px; }
.check .txt { display: flex; flex-direction: column; }
.check .txt b { font-weight: 600; }
.check .txt span { font-size: 12px; color: var(--muted); }
.seg.seg2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.actions { display: flex; flex-wrap: wrap; column-gap: 18px; row-gap: 0; align-items: center; }
.hrow .chg { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.trow .n i { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranks { display: flex; flex-direction: column; gap: 10px; }
.rank { display: grid; grid-template-columns: minmax(0, 1fr) auto 40px; column-gap: 10px; row-gap: 5px; align-items: center; font-size: 14px; }
.rank .nm { display: flex; gap: 6px; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; }
.rank .mono { font-size: 13px; text-align: right; }
.rank .bar { grid-column: 1 / -1; }
.toast { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.toast button { border: 0; background: none; color: var(--paper); font-weight: 700; text-decoration: underline; min-height: 32px; padding: 0 4px; }
input[type="search"] { -webkit-appearance: none; appearance: none; }
.sugg { margin-top: 2px; }
.sugg:empty { display: none; }
.sugg .sugg-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); align-self: center; margin-right: 2px; }
.chips.sugg button { min-height: 34px; background: var(--wash); border-color: var(--wash); display: inline-flex; gap: 6px; align-items: center; }
.chips.sugg button .mono { font-size: 12px; }
.form { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
.err { color: var(--out); font-size: 13px; font-weight: 600; }

.cat { display: grid; grid-template-columns: minmax(0, 1fr) 92px 84px 44px; gap: 8px; align-items: end; padding: 6px 0; border-bottom: 1px solid var(--rule-soft); }
.cat input, .cat select { height: 40px; border: 0; border-bottom: 1px solid var(--rule); background: var(--paper); border-radius: 0; font-size: 15px; width: 100%; min-width: 0; padding: 0 2px; }
.cat input.mono { text-align: right; }

nav.tabbar { flex: none; border-top: 1px solid var(--ink); background: var(--paper); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 6px 0 calc(8px + env(safe-area-inset-bottom, 0px)); }
nav.tabbar button { justify-self: center; min-height: 44px; min-width: 44px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 13px; color: var(--muted); padding: 0 4px; }
nav.tabbar button[aria-current="page"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
nav.tabbar .plus { width: 46px; height: 46px; background: var(--ink); color: var(--paper); border: 0; display: inline-flex; align-items: center; justify-content: center; }
nav.tabbar .plus svg { width: 22px; height: 22px; }

.toast { position: absolute; left: 20px; right: 20px; bottom: 96px; background: var(--ink); color: var(--paper); padding: 12px 14px; font-size: 14px; z-index: 5; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise 0.18s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } } }
</style>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" id="nav" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(function () {
'use strict';

/* ---------- storage ---------- */
var KEY = 'ledger-budget-v1';
function loadState() { try { var t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- date + money helpers ---------- */
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ym(d) { return d.slice(0, 7); }
function thisMonth() { return ym(todayStr()); }
function addMonths(m, n) { var y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + n; y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12; return y + '-' + pad(mo + 1); }
function daysIn(m) { return new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate(); }
function parseD(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
function fmtD(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function addDays(s, n) { return fmtD(parseD(s) + n * 86400000); }
function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function addYear(s) { var y = +s.slice(0, 4) + 1, m = y + '-' + s.slice(5, 7); return m + '-' + pad(Math.min(+s.slice(8, 10), daysIn(m))); }
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthName(m) { return MONTHS[+m.slice(5, 7) - 1]; }
function monthLabel(m) { return monthName(m) + ' ' + m.slice(0, 4); }
function monthShort(m) { return monthName(m).slice(0, 3).toUpperCase(); }
function dateShort(d) { return d.slice(8, 10) + ' ' + monthShort(ym(d)); }
function dateLong(d) { return dateShort(d) + ' ' + d.slice(0, 4); }
function monthYearShort(m) { return monthShort(m) + ' ' + m.slice(0, 4); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(p) { var v = Math.abs(p) / 100; return v.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function signed(p, plus) { return (p < 0 ? '−' : (plus && p > 0 ? '+' : '')) + money(p); }
function toPence(str) { var n = parseFloat(String(str).replace(/,/g, '.').replace(/[^0-9.]/g, '')); return isFinite(n) ? Math.round(n * 100) : 0; }
function penceToStr(p) { return (Math.abs(p) / 100).toFixed(2); }
// keep only digits and one decimal point (comma counts as a point), max 2 decimals
function cleanAmount(v) {
  v = String(v || '').replace(/,/g, '.').replace(/[^0-9.]/g, '');
  var dot = v.indexOf('.');
  if (dot !== -1) v = v.slice(0, dot + 1) + v.slice(dot + 1).replace(/\./g, '').slice(0, 2);
  var whole = dot === -1 ? v : v.slice(0, dot);
  if (whole.length > 7) v = whole.slice(0, 7) + (dot === -1 ? '' : v.slice(dot));
  return v;
}
// the amount font is monospaced, so the box can hug its digits and keep the − / + right beside them
function amountWidth(v) { v = String(v || ''); return (v ? v.length + 0.3 : 4.2) + 'ch'; }

var ICON = {
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'
};

/* ---------- state ---------- */
var INCOME_CATS = ['Salary', 'Freelance', 'Refund', 'Gift', 'Other'];
var FREQ = { none: 'Doesn’t repeat', weekly: 'Every week', '4weekly': 'Every 4 weeks', monthly: 'Every month', yearly: 'Every year' };
var FREQ_TAG = { weekly: 'Weekly', '4weekly': '4-weekly', monthly: 'Monthly', yearly: 'Yearly' };
function defaultCategories() {
  return [
    { id: 'rent', name: 'Rent', group: 'Bills', budget: null },
    { id: 'utilities', name: 'Utilities', group: 'Bills', budget: null },
    { id: 'subs', name: 'Subscriptions', group: 'Bills', budget: null },
    { id: 'groceries', name: 'Groceries', group: 'Spending', budget: 25000 },
    { id: 'transport', name: 'Transport', group: 'Spending', budget: 8000 },
    { id: 'eating', name: 'Eating out', group: 'Spending', budget: 8000 },
    { id: 'fun', name: 'Fun', group: 'Spending', budget: 10000 },
    { id: 'other', name: 'Other', group: 'Spending', budget: null }
  ];
}
function emptyState() { return { version: 2, sample: false, startDay: 1, createdAt: todayStr(), lastBackup: null, categories: defaultCategories(), pots: [], entries: [], recurring: [], skips: [] }; }
function upgrade(st) {
  st.version = 2;
  if (!st.startDay) st.startDay = 1;
  if (!st.createdAt) st.createdAt = todayStr();
  if (st.lastBackup === undefined) st.lastBackup = null;
  st.pots = st.pots || []; st.recurring = st.recurring || []; st.skips = st.skips || []; st.entries = st.entries || [];
  st.recurring.forEach(function (r) { if (!r.freq) r.freq = 'monthly'; });
  return st;
}

/* ---------- pay periods ("month starts on day N") ---------- */
function sd(st) { st = st || S; return Math.min(28, Math.max(1, +st.startDay || 1)); }
// a period is labelled by the month it mostly covers: start day 2–15 → the month it starts in; 16–28 → the month it ends in
function periodOf(date, st) {

function currentPeriod(st) { return periodOf(todayStr(), st); }

/* ---------- recurring ---------- */
function stepDate(d, f) { return f === 'weekly' ? addDays(d, 7) : f === '4weekly' ? addDays(d, 28) : addYear(d); }

  st.recurring.forEach(function (r) {
    function add(date) {
      st.entries.push({ id: uid(), type: r.type, name: r.name, amount: r.amount, date: date, categoryId: r.categoryId, potId: r.potId, withdraw: !!r.withdraw, note: '', recurId: r.id, recurDate: date });
      changed = true;
    }
    if (r.freq === 'monthly') {
      for (var m = r.start; m <= ym(horizon); m = addMonths(m, 1)) {
        var date = m + '-' + pad(Math.min(r.day, daysIn(m)));
        if (date > horizon || st.skips.indexOf(r.id + '|' + m) !== -1) continue;
        if (!st.entries.some(function (e) { return e.recurId === r.id && ym(e.date) === m; })) add(date);

        var dd = d;

}

}

/* ---------- lookups + maths ---------- */
function catById(id) { for (var i = 0; i < S.categories.length; i++) if (S.categories[i].id === id) return S.categories[i]; return null; }
function potById(id) { for (var i = 0; i < S.pots.length; i++) if (S.pots[i].id === id) return S.pots[i]; return null; }
function entryById(id) { for (var i = 0; i < S.entries.length; i++) if (S.entries[i].id === id) return S.entries[i]; return null; }
function periodEntries(p) { return S.entries.filter(function (e) { return periodOf(e.date) === p; }); }
// how much an entry counts as money out of the month (withdrawals from savings count back in)
function outValue(e) { if (e.type === 'spend') return e.amount; if (e.type === 'pot') return e.withdraw ? -e.amount : e.amount; return 0; }
function isOut(e) { return e.type === 'spend' || e.type === 'pot'; }
function groupOf(e) {
  if (e.type === 'income') return 'Income';
  if (e.type === 'pot') { var p = potById(e.potId); return p && p.kind === 'saving' ? 'Savings' : 'Debt'; }
  if (e.type === 'spend') { var c = catById(e.categoryId); return c ? c.group : 'Spending'; }
  return 'Pots';
}
function potName(id) { var p = potById(id); return p ? p.name : 'deleted pot'; }
function catName(e) {
  if (e.type === 'income') return e.categoryId || 'Income';
  if (e.type === 'pot') { var p = potById(e.potId); if (!p) return 'Pot (deleted)'; return p.kind === 'debt' ? 'Debt payment' : (e.withdraw ? 'Taken from savings' : 'Saved'); }
  if (e.type === 'adjust') return 'Balance update · ' + potName(e.potId);
  if (e.type === 'move') return potName(e.potId) + ' → ' + potName(e.toPotId);
  var c = catById(e.categoryId); return c ? c.name : 'Uncategorised';
}
function sumBy(list, fn) { return list.reduce(function (a, e) { return a + fn(e); }, 0); }
function totals(p) {

  var inc = sumBy(es.filter(function (e) { return e.type === 'income'; }), function (e) { return e.amount; });
  var out = sumBy(es, outValue);
  var pots = sumBy(es.filter(function (e) { return e.type === 'pot'; }), outValue);
  return { inc: inc, out: out, pots: pots, net: inc - out, count: es.filter(function (e) { return e.type === 'income' || isOut(e); }).length };
}
// signed change an entry makes to a pot's balance
function potDelta(e, p) {
  if (e.type === 'pot' && e.potId === p.id) return p.kind === 'saving' ? (e.withdraw ? -e.amount : e.amount) : -e.amount;
  if (e.type === 'adjust' && e.potId === p.id) return e.amount;
  if (e.type === 'move') { if (e.potId === p.id) return -e.amount; if (e.toPotId === p.id) return p.kind === 'saving' ? e.amount : -e.amount; }
  return 0;
}
function potBalance(p, st, upTo) {
  st = st || S; upTo = upTo || todayStr();
  var s = sumBy(st.entries.filter(function (e) { return e.date <= upTo; }), function (e) { return potDelta(e, p); });
  return Math.max(0, p.start + s);
}
function payoff(balance, apr, pay) {
  if (balance <= 0) return { months: 0, interest: 0 };
  var r = (apr || 0) / 1200, b = balance, n = 0, interest = 0;
  if (pay <= 0 || pay <= b * r + 0.5) return null;
  while (b > 0 && n < 600) { var i = b * r; interest += i; b = b + i - pay; n++; }
  return n >= 600 ? null : { months: n, interest: Math.round(interest) };
}
function potForecast(p) {
  var bal = potBalance(p), base = thisMonth();
  if (p.kind === 'debt') {
    if (bal <= 0) return { label: 'Paid off', value: 'DONE', months: 0 };
    var f = payoff(bal, p.apr, p.monthly);
    if (!f) return { label: 'Paid off', value: 'NEVER*', months: null, never: true };
    return { label: 'Paid off', value: monthYearShort(addMonths(base, f.months)), months: f.months, interest: f.interest };
  }
  if (!p.goal) return { label: 'Goal', value: '—', months: null };
  if (bal >= p.goal) return { label: 'Reached', value: 'DONE', months: 0 };
  if (!p.monthly) return { label: 'Reached', value: '—', months: null };
  var n = Math.ceil((p.goal - bal) / p.monthly);

}
function debtTip(p) {

  var bal = potBalance(p); if (bal <= 0) return '';

}

  st.recurring.push({ id: uid(), freq: 'yearly', type: 'spend', name: 'Contents insurance', amount: 8900, anchor: (+ins.slice(0, 4) - 1) + ins.slice(4), categoryId: 'utilities', potId: null });
  var seed = 7; function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  var shops = [['Tesco', 'groceries', 1800, 4200], ['Lidl', 'groceries', 1500, 3500], ['Train', 'transport', 900, 3400], ['Bus pass top-up', 'transport', 1000, 2000], ['Pizza night', 'eating', 1400, 2600], ['Coffee', 'eating', 300, 600], ['Cinema', 'fun', 900, 1600], ['Climbing shoes', 'fun', 6000, 9000]];
  function spend(name, cat, amt, date, note) { st.entries.push({ id: uid(), type: 'spend', name: name, amount: amt, date: date, categoryId: cat, potId: null, note: note || '', recurId: null }); }

      [['Lidl', 'groceries', 3180, 2], ['Coffee', 'eating', 420, 3], ['Train', 'transport', 3210, 3, 'Return to London'], ['Tesco', 'groceries', 2340, 7], ['Pizza night', 'eating', 1850, 5], ['Cinema', 'fun', 1250, 8], ['Tesco', 'groceries', 1960, 14], ['Bus pass top-up', 'transport', 2000, 18], ['Lidl', 'groceries', 2870, 21], ['Coffee', 'eating', 380, 24]].forEach(function (x) {

      });

  }

}

/* pot payments: last, next, history with running balance */
function deltaKind(e, p) {
  if (e.type === 'pot') return p.kind === 'debt' ? 'Payment' : (e.withdraw ? 'Taken out' : 'Deposit');
  if (e.type === 'adjust') return 'Balance update';
  if (e.type === 'move') return e.potId === p.id ? 'To ' + potName(e.toPotId) : 'From ' + potName(e.potId);
  return '';
}
function potPayments(p, debt) {
  var t = todayStr();
  var touch = S.entries.filter(function (e) { return potDelta(e, p) !== 0; })
    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var bal = p.start, rows = touch.map(function (e) { var d = potDelta(e, p); bal += d; return { e: e, d: d, after: Math.max(0, bal), due: e.date > t }; });
  var pays = rows.filter(function (r) { return r.e.type === 'pot' && !r.e.withdraw; });
  var past = pays.filter(function (r) { return !r.due; });
  var last = past[past.length - 1];
  var next = pays.filter(function (r) { return r.due; })[0], nextTxt = '';
  if (next) nextTxt = dateShort(next.e.date) + ' · ' + money(next.e.amount);
  else {
    var rec = S.recurring.filter(function (r) { return r.potId === p.id && !r.withdraw; })[0];
    if (rec) nextTxt = dateShort(nextOccurrence(rec)) + ' · ' + money(rec.amount);
  }
  var verb = debt ? 'payment' : 'deposit';
  var h = '<div class="paylines">' +
    '<div class="row"><span class="muted">Last ' + verb + '</span><span class="mono">' + (last ? dateShort(last.e.date) + ' · ' + money(last.e.amount) : 'None yet') + '</span></div>' +
    (nextTxt ? '<div class="row"><span class="muted">Next due</span><span class="mono">' + nextTxt + '</span></div>' : '') + '</div>';
  if (!rows.length) return h;
  var open = !!ui.histOpen[p.id];
  h += '<button class="histtoggle" data-act="toggleHist" data-id="' + p.id + '" aria-expanded="' + open + '"><span>History</span><span class="mono muted">' + rows.length + ' ' + (open ? '▴' : '▾') + '</span></button>';
  if (!open) return h;
  var list = rows.slice().reverse(), all = !!ui.histAll[p.id], shown = all ? list : list.slice(0, 6);
  h += '<div class="hist"><div class="hrow label"><span>Date</span><span>Change</span><span>' + (debt ? 'Owed after' : 'Saved after') + '</span></div>';
  shown.forEach(function (r) {
    var rc = r.e.recurId ? recById(r.e.recurId) : null;
    h += '<button class="hrow" data-act="editEntry" data-id="' + r.e.id + '"><span class="mono muted">' + dateShort(r.e.date) + '</span>' +
      '<span class="chg"><span class="mono">' + signed(r.d, true) + '</span> <span class="muted">' + esc(deltaKind(r.e, p)) + '</span>' + (rc ? ' <span class="tag muted">' + FREQ_TAG[rc.freq] + '</span>' : '') + (r.due ? ' <span class="tag muted">Due</span>' : '') + '</span>' +
      '<span class="mono">' + money(r.after) + '</span></button>';
  });
  h += '<div class="hrow start"><span class="mono muted">START</span><span class="muted">' + (debt ? 'Owed' : 'Already saved') + '</span><span class="mono">' + money(p.start) + '</span></div>';
  if (list.length > 6) h += '<button class="textlink quiet" data-act="histAll" data-id="' + p.id + '">' + (all ? 'Show fewer' : 'Show all ' + list.length) + '</button>';
  return h + '</div>';
}

/* quick pick: names used before (most used lately first), or matches while typing */
function suggestions(f) {
  var q = (f.name || '').trim().toLowerCase(), since = addDays(todayStr(), -120), seen = {}, list = [];
  sortDesc(S.entries.filter(function (e) { return e.type === f.type && e.name; })).slice(0, 600).forEach(function (e) {
    var k = e.name.toLowerCase(), s = seen[k];
    if (!s) { s = seen[k] = { name: e.name, last: e, amounts: [], n: 0 }; list.push(s); }
    if (e.date >= since) s.n++;
    if (s.amounts.length < 3) s.amounts.push(e.amount);
  });
  if (q) {
    list = list.filter(function (s) { var k = s.name.toLowerCase(); return k !== q && k.indexOf(q) !== -1; })
      .sort(function (a, b) { return (b.name.toLowerCase().indexOf(q) === 0) - (a.name.toLowerCase().indexOf(q) === 0) || b.n - a.n; });
  } else {
    list = list.filter(function (s) { return s.n > 0; }).sort(function (a, b) { return b.n - a.n; });
  }
  list = list.slice(0, 5);
  // only offer an amount when it has been the same the last few times (a coffee, a bus fare)
  list.forEach(function (s) { s.fixed = s.amounts.length >= 2 && s.amounts.every(function (a) { return a === s.amounts[0]; }) ? s.amounts[0] : 0; });
  return list;
}

    return '<button data-act="useSugg" data-i="' + i + '">' + esc(s.name) + (s.fixed ? ' <span class="mono muted">' + money(s.fixed) + '</span>' : '') + '</button>';

}
function budgetNote(e) {

    S.entries.push({ id: uid(), type: 'move', name: 'Moved to ' + potName(f.to), amount: amt, date: f.date, potId: f.from, toPotId: f.to, note: '', recurId: null });
    save(); go('pots'); toast('Moved ' + money(amt));
  },

  editRec: function (el) {
    var r = recById(el.dataset.id); if (!r) return;
    ui.recForm = { id: r.id, name: r.name, amount: penceToStr(r.amount), freq: r.freq, next: nextOccurrence(r), error: '', back: ui.view };
    go('recform');
  },
  saveRec: function () {
    readRecInputs();
    var f = ui.recForm, r = recById(f.id); if (!r) return go(f.back);
    var amount = toPence(f.amount);
    if (amount <= 0) { f.error = 'Enter an amount above zero.'; return render(); }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.next)) { f.error = 'Pick the date of the next one.'; return render(); }
    var t = todayStr();
    // drop future copies, then regenerate them with the new settings
    S.entries = S.entries.filter(function (e) { return !(e.recurId === r.id && e.date > t); });
    r.name = (f.name || '').trim() || r.name; r.amount = amount; r.freq = f.freq;
    // forget skips for dates still to come; past ones stay skipped
    S.skips = S.skips.filter(function (k) { var part = k.split('|')[1]; return k.indexOf(r.id + '|') !== 0 || part <= t.slice(0, part.length); });
    if (r.freq === 'monthly') {
      r.day = +f.next.slice(8, 10); delete r.anchor;
      if (!r.start || r.start > ym(f.next)) r.start = ym(f.next);
      // months between now and the chosen next date that have no copy yet are left out
      for (var m = thisMonth(); m < ym(f.next); m = addMonths(m, 1)) {
        var mm = m;
        if (!S.entries.some(function (e) { return e.recurId === r.id && ym(e.date) === mm; })) S.skips.push(r.id + '|' + m);
      }
    } else { r.anchor = f.next; }
    syncRecurring(S); save(); toast('Saved'); go(f.back);
  },
  stopRec: function () {
    if (!ui.deleteArmed) { ui.deleteArmed = true; readRecInputs(); return render(); }
    var snap = snapshot(), id = ui.recForm.id, t = todayStr();
    S.entries = S.entries.filter(function (e) { return !(e.recurId === id && e.date > t); });
    S.entries.forEach(function (e) { if (e.recurId === id) e.recurId = null; });
    S.recurring = S.recurring.filter(function (r) { return r.id !== id; });
    save(); go(ui.recForm.back); toast('Stopped. Past entries are kept.', snap);
  },

  addCat: function () { S.categories.push({ id: uid(), name: 'New category', group: 'Spending', budget: null }); save(); keepScroll(render); var inputs = document.querySelectorAll('.cat input[data-field="name"]'); var last = inputs[inputs.length - 1]; if (last) { last.focus(); last.select(); } },
  delCat: function (el) {
    var snap = snapshot(), id = el.dataset.id, used = S.entries.some(function (e) { return e.categoryId === id; });
    S.categories = S.categories.filter(function (c) { return c.id !== id; });
    save(); keepScroll(render); toast(used ? 'Deleted. Its entries now show as Uncategorised.' : 'Category deleted', snap);
  },
  exportJson: function () {
    var text = JSON.stringify(S, null, 2);
    shareFile(text, 'budget-backup-' + todayStr() + '.json', 'application/json', function () { S.lastBackup = todayStr(); save(); ui.exportText = ''; keepScroll(render); toast('Backup saved'); },
      function () { ui.exportText = text; ui.exportKind = 'json'; keepScroll(render); });
  },
  exportCsv: function () {
    var rows = [['date', 'type', 'group', 'category_or_pot', 'name', 'amount', 'repeats', 'note']];
    sortDesc(S.entries).reverse().forEach(function (e) {
      var label = e.type === 'pot' || e.type === 'adjust' ? potName(e.potId) : e.type === 'move' ? potName(e.potId) + ' -> ' + potName(e.toPotId) : catName(e);
      var amt = e.type === 'income' ? e.amount : e.type === 'adjust' ? e.amount : e.type === 'move' ? e.amount : -outValue(e);
      var r = e.recurId ? recById(e.recurId) : null;
      rows.push([e.date, e.type === 'pot' && e.withdraw ? 'withdrawal' : e.type, groupOf(e), label, e.name, (amt < 0 ? '-' : '') + penceToStr(amt), r ? r.freq : '', e.note || '']);
    });
    var text = rows.map(function (r) { return r.map(function (c) { c = String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
    shareFile(text, 'budget-entries-' + todayStr() + '.csv', 'text/csv', function () { ui.exportText = ''; keepScroll(render); toast('CSV shared'); },
      function () { ui.exportText = text; ui.exportKind = 'csv'; keepScroll(render); });
  },
  download: function () {
    try {
      var blob = new Blob([ui.exportText], { type: ui.exportKind === 'csv' ? 'text/csv' : 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'budget-' + (ui.exportKind === 'csv' ? 'entries' : 'backup') + '-' + todayStr() + (ui.exportKind === 'csv' ? '.csv' : '.json');
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      if (ui.exportKind === 'json') { S.lastBackup = todayStr(); save(); }
    } catch (e) { toast('Download isn’t available here. Use Copy text.'); }
  },
  copyExport: function () {
    var box = document.getElementById('exportBox');
    var done = function () { if (ui.exportKind === 'json') { S.lastBackup = todayStr(); save(); } toast('Copied'); };
    var fallback = function () { if (box) { box.focus(); box.select(); } toast('Text selected. Copy it from the box.'); };
    try { navigator.clipboard.writeText(ui.exportText).then(done, fallback); } catch (e) { fallback(); }
  },
  importText: function () { restore(val('importText') || ''); },
  loadSample: function () { S = sampleState(); save(); ui.month = currentPeriod(); go('home'); toast('Sample data loaded'); },
  clearSample: function () { var snap = snapshot(); S = emptyState(); save(); ui.month = currentPeriod(); go('home'); toast('Cleared. Ready for your own entries.', snap); },
  reset: function () {
    if (!ui.resetArmed) { ui.resetArmed = true; return keepScroll(render); }
    var snap = snapshot(); S = emptyState(); save(); ui.month = currentPeriod(); ui.exportText = ''; go('home'); toast('Everything erased', snap);
  }
};

function shareFile(text, name, mime, done, fallback) {
  try {
    var file = new File([text], name, { type: mime });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(done, function (err) { if (err && err.name === 'AbortError') return; fallback(); });
      return;
    }
  } catch (e) {}
  fallback();
}
var storageKept = null;
function storageLine() {
  if (storageKept === true) return '<div class="sub">This phone has agreed to keep the app’s data unless you delete the app.</div>';
  if (storageKept === false) return '<div class="sub">This browser may clear the data if storage runs low, so keep backups.</div>';
  return '';
}
try {
  if (navigator.storage && navigator.storage.persisted) {
    navigator.storage.persisted().then(function (p) {
      if (p || !navigator.storage.persist) { storageKept = !!p; return; }
      return navigator.storage.persist().then(function (g) { storageKept = !!g; });
    }).catch(function () {});
  }
} catch (e) {}

function restore(text) {
  try {
    var obj = JSON.parse(text);
    if (!obj || !Array.isArray(obj.entries) || !Array.isArray(obj.categories)) throw new Error('shape');
    S = upgrade(obj); syncRecurring(S); save(); ui.month = currentPeriod(); go('home'); toast('Backup restored');
  } catch (e) { toast('That doesn’t look like a backup from this app.'); }
}

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return;
  var fn = A[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el); }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.dataset && el.dataset.cat) {
    var c = catById(el.dataset.cat); if (!c) return;
    if (el.dataset.field === 'name') c.name = el.value.trim() || c.name;
    else if (el.dataset.field === 'group') c.group = el.value;
    else if (el.dataset.field === 'budget') { var p = toPence(el.value); c.budget = p > 0 ? p : null; }
    save();
  } else if (el.id === 'set-start') {
    var n = parseInt(el.value, 10);
    if (!(n >= 1 && n <= 28)) { toast('Pick a day from 1 to 28.'); el.value = sd(); return; }
    S.startDay = n; syncRecurring(S); save(); ui.month = currentPeriod(); keepScroll(render); toast(n === 1 ? 'Using calendar months' : 'Your month now starts on day ' + n);
  } else if (el.id === 'importFile' && el.files && el.files[0]) {
    var rd = new FileReader(); rd.onload = function () { restore(String(rd.result)); }; rd.readAsText(el.files[0]);
  } else if ((el.id === 'f-date' || el.id === 'f-repeat') && ui.form && ui.form.mode === 'add') {
    readFormInputs(); var hint = el.closest('.form').querySelector('#f-repeat + .hint'); if (hint) hint.textContent = repeatHint(ui.form);
  } else if (el.id === 'm-from' && ui.moveForm) {
    ui.moveForm.from = el.value; ui.moveForm.amount = val('m-amount') || ''; if (ui.moveForm.to === el.value) ui.moveForm.to = (S.pots.filter(function (p) { return p.id !== el.value; })[0] || {}).id; render();
  }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'f-amount' && ui.form) {
    var c = cleanAmount(t.value);
    if (c !== t.value) t.value = c;
    t.style.width = amountWidth(c);
    ui.form.digits = c; ui.form.error = '';
  } else if (t.id === 'f-name' && ui.form) {
    ui.form.name = t.value; var sg = document.getElementById('sugg'); if (sg) sg.innerHTML = suggestHtml(ui.form);
  } else if (t.id === 's-q') {
    ui.query = t.value; document.getElementById('results').innerHTML = searchResults(t.value.trim().toLowerCase());
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  var id = ev.target.id;
  if (id === 'f-amount' || id === 's-q' || id === 'f-name') { ev.preventDefault(); ev.target.blur(); }
  else if (id === 'f-note') { ev.preventDefault(); A.saveEntry(); }
  else if (id === 'a-value' || id === 'a-note') { ev.preventDefault(); A.saveAdj(); }
});
// pick up new repeats when the app is reopened on a later day
document.addEventListener('visibilitychange', function () { if (!document.hidden && syncRecurring(S)) { save(); keepScroll(render); } });

render();
if (firstRun) toast('Sample data loaded so you can try it out');

if (window.__PWA__ && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
}
window.__ledger = { state: function () { return S; }, totals: totals, payoff: payoff, periodOf: periodOf, periodRange: periodRange, potBalance: function (id) { return potBalance(potById(id)); } };
})();
</script>
